aid: branching-minds
name: Branching Minds
description: Branching Minds is a K-12 education-technology company offering an MTSS (Multi-Tiered
  System of Supports) and RTI (Response to Intervention) software platform for school districts.
  The platform centralizes student data, intervention planning, progress monitoring, attendance,
  behavior support, and early-warning indicators in one place, and integrates with district SIS,
  universal screeners, and assessment tools through nightly data syncs, secure SFTP, and a guided
  file uploader. Branching Minds does not currently publish a public developer API; integration is
  delivered as managed data connections rather than a self-serve API. The company is a Delaware
  public-benefit LLC and Certified B Corporation, backed by Techstars.
